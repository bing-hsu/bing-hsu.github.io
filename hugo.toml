baseURL = 'https://bing-hsu.github.io/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages.en]
  locale = 'en-US'
  label = 'English'
  weight = 1
  title = 'Bertram — Judgment & Building'
  [languages.en.params]
    description = 'Data analysis, intelligence research, and hands-on engineering. Better questions. Clearer decisions. Useful software.'

[languages.zh]
  locale = 'zh-CN'
  label = '中文'
  weight = 2
  hasCJKLanguage = true
  title = 'Bertram — Judgment & Building'
  [languages.zh.params]
    description = '以数据分析与情报研究形成判断，以结果导向的工程实践推动行动。问清问题，做出判断，把方案落地。'


# Presentation is owned by this project; no external theme is required.
[params]
  description = "Better questions. Clearer decisions. Useful software."
  mainSections = ['posts']

[params.contact]
  email = 'bingxug@gmail.com'
  wechatQR = 'img/wechat-qr.jpeg'

# Social Tags

[[params.social]]
name = "GitHub"
icon = "github"
url = "https://github.com/bing-hsu"

# Main menu Items
# [[menu.main]]
# name = "About"
# url = "/about"
# weight = 1

[[menu.main]]
name = "Posts"
url = "/posts"
weight = 2

[[menu.main]]
name = "Tags"
url = "/tags"
weight = 3

[[menu.main]]
name = "Search"
url = "/search/"
weight = 4

[markup]
	[markup.goldmark]
		[markup.goldmark.extensions]
			[markup.goldmark.extensions.passthrough]
				enable = true
				[markup.goldmark.extensions.passthrough.delimiters]
					block = [['$$', '$$'], ['\\[', '\\]']]
					inline = [['$', '$'], ['\\(', '\\)']]

[markup.goldmark.renderer]
# enable html in markdown
unsafe = true
