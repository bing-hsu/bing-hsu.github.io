baseURL = 'https://bing-hsu.github.io/'
locale = 'en-us'
title = "Bertram's Blog"
# Presentation is owned by this project; no external theme is required.
[params]
  description = "Notes on deep learning, robotics, and the ideas underneath. A technical notebook by Bertram."
  mainSections = ['posts']

# Social Tags

[[params.social]]
name = "GitHub"
icon = "github"
url = "https://github.com/bing-hsu"

[[params.social]]
name = "X"
icon = "X"
url = "https://x.com/GBingxu"

# Main menu Items
# [[menu.main]]
# name = "About"
# url = "/about"
# weight = 1

[[menu.main]]
name = "Posts"
url = "/posts"
weight = 2

[[menu.main]]
name = "Tags"
url = "/tags"
weight = 3

[[menu.main]]
name = "Search"
url = "/search/"
weight = 4

[markup]
	[markup.goldmark]
		[markup.goldmark.extensions]
			[markup.goldmark.extensions.passthrough]
				enable = true
				[markup.goldmark.extensions.passthrough.delimiters]
					block = [['$$', '$$'], ['\\[', '\\]']]
					inline = [['$', '$'], ['\\(', '\\)']]

[markup.goldmark.renderer]
# enable html in markdown
unsafe = true