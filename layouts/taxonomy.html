{{ define "main" }}
<section class="page-intro"><p class="eyebrow">{{ i18n "methods" }}</p><h1>{{ i18n "topics" }}<span class="accent">.</span></h1><p>{{ i18n "topicIntro" }}</p></section>
<div class="topic-grid">{{ range .Data.Terms.Alphabetical }}<a class="topic-tile" href="{{ .Page.RelPermalink }}"><span class="eyebrow">{{ .Count }} {{ i18n "entries" }}</span><h2>{{ .Page.Title }}</h2><span class="topic-tile-arrow">↗</span></a>{{ else }}{{ partial "empty.html" . }}{{ end }}</div>
{{ end }}
