<section class="contact-section" id="contact" aria-labelledby="contact-title">
  <div class="contact-copy">
    <h2 id="contact-title">{{ i18n "contact" }}</h2>
    <p>{{ i18n "contactIntro" }}</p>
    <h3>{{ i18n "email" }}</h3>
    <a class="contact-email" href="mailto:{{ .Site.Params.contact.email }}">{{ .Site.Params.contact.email }}</a>
    {{ range .Site.Params.social }}
    <h3>{{ .name }}</h3>
    <a class="contact-email" href="{{ .url }}">{{ .url | replaceRE "^https?://" "" }}</a>
    {{ end }}
    <h3>{{ i18n "wechat" }}</h3>
    <p>{{ i18n "wechatHint" }}</p>
  </div>
  <figure class="wechat-qr">
    <a href="{{ .Site.Params.contact.wechatQR | relURL }}" aria-label="{{ i18n "openQR" }}"><img src="{{ .Site.Params.contact.wechatQR | relURL }}" alt="{{ i18n "wechatAlt" }}" width="888" height="1131" loading="lazy"></a>
    <figcaption><a class="text-link" href="{{ .Site.Params.contact.wechatQR | relURL }}">{{ i18n "openQR" }}</a></figcaption>
  </figure>
</section>
