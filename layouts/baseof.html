<!doctype html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
{{ partial "header.html" . }}
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="site-shell">
<header class="site-header">
  <a class="wordmark" href="{{ "" | relURL }}" aria-label="Bertram, data analytics and business thinking, home">bertram<span class="wordmark-dot">.</span><span class="wordmark-caption">analytics &amp; business thinking</span></a>
  <nav aria-label="Main navigation">
    <a href="{{ "posts/" | relURL }}" {{ if eq .Section "posts" }}aria-current="page"{{ end }}>Writing</a>
    <a href="{{ "tags/" | relURL }}" {{ if eq .Section "tags" }}aria-current="page"{{ end }}>Topics</a>
    <a class="search-nav" href="{{ "search/" | relURL }}" {{ if eq .Layout "search" }}aria-current="page"{{ end }}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>Search</span></a>
  </nav>
</header>
<main id="main">{{ block "main" . }}{{ end }}</main>
<footer class="site-footer"><div><a class="footer-name" href="{{ "" | relURL }}">bertram.</a><p>Data. Context. Better decisions.</p></div><nav aria-label="Elsewhere">{{ range .Site.Params.social }}<a href="{{ .url }}">{{ .name }} ↗</a>{{ end }}<a href="{{ "index.xml" | relURL }}">RSS ↗</a></nav><span class="footer-note">Independent thinking. Built with Hugo.</span></footer>
</div>
</body>
</html>
